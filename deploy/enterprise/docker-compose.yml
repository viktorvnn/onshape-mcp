services:
  onshape-mcp:
    build:
      context: ../..
    command: ["http"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ONSHAPE_MCP_HTTP__PRODUCTION: "true"
      ONSHAPE_MCP_HTTP__HOST: "0.0.0.0"
      ONSHAPE_MCP_HTTP__PORT: "8080"
      ONSHAPE_MCP_HTTP__PUBLIC_URL: "https://${MCP_DOMAIN:?set MCP_DOMAIN}"
      ONSHAPE_MCP_HTTP__ONSHAPE_CLIENT_ID: "${ONSHAPE_CLIENT_ID:?set ONSHAPE_CLIENT_ID}"
      ONSHAPE_MCP_HTTP__ONSHAPE_COMPANY_ID: "${ONSHAPE_COMPANY_ID:?set ONSHAPE_COMPANY_ID}"
      ONSHAPE_MCP_HTTP__ONSHAPE_CLIENT_SECRET_FILE: /run/secrets/onshape-client-secret
      ONSHAPE_MCP_HTTP__STATE_FILE: /var/lib/onshape-mcp/oauth-state.enc
      ONSHAPE_MCP_HTTP__STATE_ENCRYPTION_KEY_FILE: /run/secrets/state-encryption-key
      ONSHAPE_MCP_HTTP__MAX_REQUEST_BODY_BYTES: "16777216"
      ONSHAPE_MCP_HTTP__MAX_REGISTERED_CLIENTS: "1000"
      ONSHAPE_MCP_HTTP__MAX_PENDING_AUTHORIZATIONS: "256"
    volumes:
      - oauth-state:/var/lib/onshape-mcp
      - ./secrets/onshape-client-secret:/run/secrets/onshape-client-secret:ro
      - ./secrets/state-encryption-key:/run/secrets/state-encryption-key:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      onshape-mcp:
        condition: service_healthy
    environment:
      MCP_DOMAIN: "${MCP_DOMAIN:?set MCP_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  oauth-state:
  caddy-data:
  caddy-config:

networks:
  backend:
